[package]
name = "tempo"
version = "0.1.0"
description = "Desktop calendar and task manager"
authors = ["Tempo"]
edition = "2021"
rust-version = "1.77.2"

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name on Windows.
name = "tempo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `tray-icon` is what lets the app keep running with no window on screen, which
# is the only way a reminder can fire after the user has closed it.
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
# Used directly for the one notification path that has to report its errors;
# the plugin delivers on a detached task and discards the result.
notify-rust = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The automatic spending feed: a Turkish bank will not hand account data to a
# personal application, but it will send a message per transaction. `native-tls`
# uses schannel on Windows, so this adds no OpenSSL dependency.
imap = "2"
native-tls = "0.2"
mailparse = "0.15"
# The mailbox password belongs in the OS credential store, never in the JSON
# document the rest of the app is written to.
keyring = { version = "3", features = ["windows-native", "apple-native", "sync-secret-service"] }

# Shipping a fix is only half of shipping it: without these, the app a user
# installed once stays that version forever. `process` is what restarts the app
# after the new bundle has been written over it.
#
# Desktop-only: there is no self-update on the mobile targets this crate also
# builds for — the store owns updates there.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
